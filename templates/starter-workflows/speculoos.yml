# Managed by templates/repo-workflow-materialization-manifest.json.
# Edit this canonical template, then rematerialize the live workflow.
name: Speculoos
run-name: Speculoos · PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches:
      - '**'
      - '!main'
      - '!master'
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: >-
    speculoos-${{ github.repository_id }}-${{ github.event.pull_request.number }}-${{
      github.event.pull_request.head.sha
    }}
  cancel-in-progress: true

jobs:
  speculoos:
    name: speculoos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify exact head and base availability
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch --quiet --no-tags origin \
            "+refs/heads/$EXPECTED_BASE_REF:refs/remotes/origin/$EXPECTED_BASE_REF"
          git rev-parse --verify "refs/remotes/origin/$EXPECTED_BASE_REF^{commit}" >/dev/null

      - name: Install immutable Speculoos release
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            'git+https://github.com/fr-meyer/speculoos.git@8156bc20fc7563941c17514eb551e894ce29c89b'
          test "$(speculoos --version)" = 'speculoos 0.7.0'

      - name: Resolve exact task contract
        id: task
        shell: bash
        env:
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          import yaml

          manifest = yaml.safe_load(Path('.speculoos/manifest.yaml').read_text(encoding='utf-8'))
          task_id = str((manifest or {}).get('current_task', '')).strip()
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,127}', task_id):
              raise SystemExit('invalid or missing manifest current_task')
          task_path = Path('.speculoos/tasks') / f'{task_id}.yaml'
          if not task_path.is_file() or task_path.is_symlink():
              raise SystemExit('current task metadata is missing or unsafe')
          task = yaml.safe_load(task_path.read_text(encoding='utf-8'))
          if not isinstance(task, dict) or str(task.get('id', '')).strip() != task_id:
              raise SystemExit('current task identity mismatch')
          if str(task.get('branch', '')).strip() != os.environ['EXPECTED_HEAD_REF']:
              raise SystemExit('current task branch does not match pull-request head')
          if str(task.get('base_branch', '')).strip() != os.environ['EXPECTED_BASE_REF']:
              raise SystemExit('current task base does not match pull-request base')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'task_id={task_id}\n')
          PY

      - name: Validate Speculoos policy and exact pull-request diff
        shell: bash
        env:
          TASK_ID: ${{ steps.task.outputs.task_id }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/speculoos
          speculoos validate \
            --repo . \
            --repo-slug "$GITHUB_REPOSITORY" \
            --base "$EXPECTED_BASE_REF" \
            --task "$TASK_ID" \
            --validation "git diff --check origin/$EXPECTED_BASE_REF...HEAD" \
            --json | tee artifacts/speculoos/validate.json

      - name: Validate publication contract
        shell: bash
        env:
          TASK_ID: ${{ steps.task.outputs.task_id }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          args=(
            --repo .
            --repo-slug "$GITHUB_REPOSITORY"
            --base "origin/$EXPECTED_BASE_REF"
            --task "$TASK_ID"
            --json
          )
          pr_body="specs/$TASK_ID/pr-body.md"
          commit_message="specs/$TASK_ID/commit-message.txt"
          if [[ -f "$pr_body" && ! -L "$pr_body" ]]; then
            args+=(--pr-body "$pr_body")
          fi
          if [[ -f "$commit_message" && ! -L "$commit_message" ]]; then
            args+=(--commit-message "$commit_message")
          fi
          speculoos publish-check "${args[@]}" | tee artifacts/speculoos/publish-check.json

      - name: Persist independent Speculoos evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: speculoos-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/speculoos
          if-no-files-found: error
          retention-days: 90
