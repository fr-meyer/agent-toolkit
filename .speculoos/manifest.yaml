schema_version: 0.1
project: agent-toolkit
workflow: speculoos-v1
canonical_task: pr-080-agent-toolkit-review-gate
repository:
  upstream: fr-meyer/agent-toolkit
  base_branch: dev
  default_branch: main
status:
  phase: implementation
  blocker_summary:
    - The write-capable source is implemented locally; publication, serving-ref activation, publisher-token provisioning, and the first hosted write pilot require separate exact-SHA approval.
    - Pullfrog provider push, approval, native repository-wide auto-merge, CI autofix, release, deployment, branch deletion, credentials, billing, and hosted settings remain disabled or separately gated. A repository-owned exact-head gate may auto-merge eligible feature PRs only into `dev`.
publication_policy:
  repository_visibility: shared-repository
  intended_public_visibility: public
  license: MIT
release_policy:
  branch_model: feature-branch-to-dev
  stable_branch: main
  integration_branch: dev
  release_gate: separate-explicit-approval
review_policy:
  self_managed:
    policy: disabled
    evidence_source: historical-only; never satisfies required_pr_review
  legacy_pullfrog:
    policy: disabled
    evidence_source: historical-only
  pullfrog_review:
    policy: primary
    evidence_source: exact-head Pullfrog review plus app-bound pullfrog and pullfrog-approval checks
    controls:
      provider_push: disabled
      candidate_validation: fresh_read_only_job
      trusted_publisher: implemented_local_not_activated
      shell: restricted
      approval: disabled
      remediation: native_fix_review_local_candidate_only
      ci_autofix: disabled
      auto_merge: pullfrog-native-disabled; repository-owned-dev-only
  speculoos_evidence:
    policy: required
    evidence_source: independent exact-head hosted policy check
  legacy_coderabbit:
    policy: disabled
    evidence_source: historical-only
  mergeguez_review:
    policy: disabled
    evidence_source: historical-only; Mergeguez is not a reviewer in the target architecture
  required_pr_review:
    policy: required
    primary:
      - pullfrog_review
    fallback_summary: No self-managed, Mergeguez, or CodeRabbit review may replace an exact-head Pullfrog review.
actor_policy:
  commit_actor: human_approved_agent_assisted
  push_actor: franck_user_pr_author
  pr_actor: franck_user_pr_author
  review_actor: pullfrog_review
  default_merge_actor: user_api
  feature_to_dev_merge_actor: mergeguez_dev_merge
  feature_to_dev_auto_merge_actor: github_actions_dev_auto_merge
  stable_auto_merge: forbidden
  native_review_requires_distinct_author: true
  exact_pr_base_head_sha_required: true
surfaces:
  manifest:
    enabled: true
    authority: canonical
  github_pull_request:
    enabled: true
    status: open-auto-merge-change-pending-publication
    number: 95
    base_branch: dev
    default_branch: main
    head_branch: feat/pullfrog-write-capable-loop
    head_sha: null
    head_sha_source: The hosted PR is clean at repaired head 814b86cb1b4bdb26296a5c8aa708816f3ce68738 until this validated target-aware auto-merge change is committed and published; use live GitHub readback for the exact current head
    merge_commit: null
gates:
  before_publish:
    - human-approval
    - tests-pass
    - private-data-check-pass
    - review-policy-recorded
    - review-request-dry-run-pass
    - write-capable-publication-explicit-approval
  after_publish:
    - exact-head-pullfrog-review-requested
    - exact-head-pullfrog-ci-speculoos-evidence
    - hosted-write-pilot-separate-approval
current_task: pullfrog-cloud-remediation-20261028
current_task_metadata: .speculoos/tasks/pullfrog-cloud-remediation-20261028.yaml
