schema_version: 0.1
project: agent-toolkit
workflow: speculoos-v1
canonical_task: pr-080-agent-toolkit-review-gate
repository:
  upstream: fr-meyer/agent-toolkit
  base_branch: dev
  default_branch: main
status:
  phase: implementation
  blocker_summary:
    - Write-capable remediation remains disabled until this dry-run coordinator and the hosted event/evidence matrix pass.
    - Pullfrog push, approval, CI autofix, auto-merge, release, deployment, branch deletion, credentials, billing, and hosted settings remain separately gated.
publication_policy:
  repository_visibility: shared-repository
  intended_public_visibility: public
  license: MIT
release_policy:
  branch_model: feature-branch-to-dev
  stable_branch: main
  integration_branch: dev
  release_gate: separate-explicit-approval
review_policy:
  self_managed:
    policy: disabled
    evidence_source: historical-only; never satisfies required_pr_review
  legacy_pullfrog:
    policy: disabled
    evidence_source: historical-only
  pullfrog_review:
    policy: primary
    evidence_source: exact-head Pullfrog review plus app-bound pullfrog and pullfrog-approval checks
    controls:
      push: disabled
      shell: restricted
      approval: disabled
      remediation: disabled
      ci_autofix: disabled
      auto_merge: disabled
  speculoos_evidence:
    policy: required
    evidence_source: independent exact-head hosted policy check
  legacy_coderabbit:
    policy: disabled
    evidence_source: historical-only
  mergeguez_review:
    policy: disabled
    evidence_source: historical-only; Mergeguez is not a reviewer in the target architecture
  required_pr_review:
    policy: required
    primary:
      - pullfrog_review
    fallback_summary: No self-managed, Mergeguez, or CodeRabbit review may replace an exact-head Pullfrog review.
actor_policy:
  commit_actor: human_approved_agent_assisted
  push_actor: franck_user_pr_author
  pr_actor: franck_user_pr_author
  review_actor: pullfrog_review
  default_merge_actor: user_api
  feature_to_dev_merge_actor: mergeguez_dev_merge
  native_review_requires_distinct_author: true
  exact_pr_base_head_sha_required: true
surfaces:
  manifest:
    enabled: true
    authority: canonical
  github_pull_request:
    enabled: true
    status: planned
    base_branch: dev
    default_branch: main
    head_branch: chore/pullfrog-cloud-coordinator-dry-run
    head_sha: null
    head_sha_source: Local feature branch only; publication requires separate approval and live exact-head readback
    merge_commit: null
gates:
  before_publish:
    - human-approval
    - tests-pass
    - private-data-check-pass
    - review-policy-recorded
    - review-request-dry-run-pass
  after_publish:
    - exact-head-pullfrog-review-requested
    - exact-head-pullfrog-ci-speculoos-evidence
current_task: pullfrog-cloud-coordinator-20261027
current_task_metadata: .speculoos/tasks/pullfrog-cloud-coordinator-20261027.yaml
