schema_version: 0.1
project: agent-toolkit
workflow: speculoos-v1
canonical_task: pullfrog-review-cutover-20261026
repository:
  upstream: fr-meyer/agent-toolkit
  base_branch: dev
  default_branch: main
status:
  phase: implementation
  blocker_summary:
    - Pullfrog is enabled for required review and explicit manual remediation; merge remains blocked until live exact-head pullfrog and pullfrog-approval checks succeed after the latest push.
publication_policy:
  repository_visibility: shared-repository
  intended_public_visibility: public
  license: MIT
release_policy:
  branch_model: feature-branch-to-dev
  stable_branch: main
  integration_branch: dev
  release_gate: separate-explicit-approval
review_policy:
  self_managed:
    policy: optional
    fallback_role: emergency_fallback
    evidence_source: ignored local self-review artifact
  legacy_pullfrog:
    policy: disabled
    evidence_source: historical-only
  pullfrog_review:
    policy: primary
    evidence_source: exact-head pullfrog and pullfrog-approval checks plus the Pullfrog review thread
    required_checks:
      - pullfrog
      - pullfrog-approval
    controls:
      push: restricted_non_default_branches
      pre_push_branch_allowlist:
        - feat/*
        - fix/*
        - docs/*
        - test/*
        - chore/*
      shell: restricted
      approval: disabled
      review_model: openai/gpt-sol
      review_effort: xhigh
      remediation: explicit_fix_all_or_fix_likes_only
      remediation_model: openai/gpt-luna
      remediation_effort: xhigh
      automatic_address_reviews: disabled
      post_remediation_rereview: required_exact_head
      ci_autofix: disabled
      auto_merge: disabled
  legacy_coderabbit:
    policy: disabled
    evidence_source: historical-only
  mergeguez_review:
    policy: disabled
    evidence_source: historical-only; not accepted for normal closeout after the Pullfrog cutover
  required_pr_review:
    policy: required
    primary:
      - pullfrog_review
    fallback_summary: Neither self-managed nor Mergeguez review evidence satisfies normal closeout; both exact-head Pullfrog checks are mandatory.
actor_policy:
  commit_actor: human_approved_agent_assisted
  push_actor: franck_user_pr_author
  pr_actor: franck_user_pr_author
  review_actor: pullfrog_review
  default_merge_actor: user_api
  feature_to_dev_merge_actor: mergeguez_dev_merge
  native_review_requires_distinct_author: true
  exact_pr_base_head_sha_required: true
surfaces:
  manifest:
    enabled: true
    authority: canonical
  github_pull_request:
    enabled: true
    status: planned
    base_branch: dev
    default_branch: main
    head_branch: chore/pullfrog-review-cutover-20261026
    head_sha: null
    head_sha_source: Live cutover PR exact-head readback supplies review and merge gates; no self-referential SHA is committed
    merge_commit: null
gates:
  before_publish:
    - human-approval
    - tests-pass
    - private-data-check-pass
    - review-policy-recorded
  after_publish:
    - exact-head-pullfrog-status-check-success
    - exact-head-pullfrog-approval-check-success
    - exact-head-review-and-check-evidence
current_task: pullfrog-review-cutover-20261026
current_task_metadata: .speculoos/tasks/pullfrog-review-cutover-20261026.yaml
