scope:
  - remove obsolete active CodeRabbit workflow entrypoints and canonical templates
  - remove retired scripts/coderabbit automation helpers
  - remove retired assets from workflow materialization, distribution, and ref-sync manifests
  - update workflow documentation and maintenance entrypoints to describe only active assets
  - preserve unrelated compatibility skills and historical records outside active workflow surfaces
non_goals:
