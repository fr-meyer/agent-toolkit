id: pr-066-container-source-rebuild-guard
title: Bootstrap and recover guarded PR 66 container rebuild remediation
status: implementation
branch: feat/container-source-rebuild-guard
base_branch: dev
write_paths:
  - .github/workflows/pr-automation-dogfood-pr-trigger.yml
  - .speculoos/manifest.yaml
  - .speculoos/tasks/pr-066-container-source-rebuild-guard.yaml
  - scripts/github/tests/test_pullfrog_cloud_remediation_workflow_policy.py
  - skills/container-runtime-change-control/SKILL.md
  - specs/pr-066-container-source-rebuild-guard/commit-message.txt
  - specs/pr-066-container-source-rebuild-guard/pr-body.md
  - templates/starter-workflows/pr-automation-dogfood-pr-trigger.yml
scope:
  - preserve the original container runtime change-control guard against disguised source rebuild rollbacks
  - make the provider-free dogfood workflow manually dispatchable on an exact selected ref without changing its pull-request path filters
  - bind PR 66 to the repository-owned Speculoos exact-head contract
  - preserve the cloud remediation loop's 90-day fail-closed history boundary for this older pull request
  - apply Pullfrog's two existing findings through the protected manual publication lane, then require a fresh exact-head Pullfrog re-review
non_goals:
  - changing or broadening the dogfood pull-request path filters
  - fabricating, copying, renaming, or manually publishing a successful check
  - weakening or bypassing the cloud remediation history-retention, exact-head, app identity, review, CI, Speculoos, destination, or merge gates
  - enabling Astra, fallback variables, provider write authority, force-push, approval, auto-merge, release, deployment, settings changes, billing changes, or branch deletion
acceptance:
  - the canonical and materialized dogfood trigger remain byte-identical and gain only a bounded workflow_dispatch event in addition to the existing pull_request event
  - pull-request path filters remain byte-for-byte unchanged
  - the policy test requires the manual trigger and the existing non-stable base coverage
  - the Speculoos publication packet exactly lists the final PR diff against dev and passes the repository-bound exact-head contract
  - hosted dogfood and Speculoos checks are produced by GitHub Actions for the exact current PR head, never synthesized through the Checks API
  - the protected manual remediation implements only Pullfrog's two existing findings after the cloud fixer refuses the PR's expired evidence window
  - Pullfrog remains the sole AI reviewer and must re-review the final exact head
delivery_policy:
  mode: inherit_branch_policy
documentation_impact:
  status: task-packet-only
  rationale: The workflow capability and PR-specific safety boundary are recorded in the repository-owned Speculoos task and publication packet; no top-level README or docs page changes are needed.
validation:
  - python3 -I scripts/github/tests/test_pullfrog_cloud_remediation_workflow_policy.py -v
  - scripts/github/validate_pullfrog_workflow.sh
  - python3 -I scripts/github/speculoos_pr_contract.py --repo . --repo-slug fr-meyer/agent-toolkit --task pr-066-container-source-rebuild-guard --expected-head-ref feat/container-source-rebuild-guard --expected-head-sha "$(git rev-parse HEAD)" --expected-base-ref dev --expected-base-sha "$(git rev-parse origin/dev)"
  - git diff --check origin/dev...HEAD
private_data_scan: required
publish_authority: Exact PR 66 bootstrap publication only after protected-lane approval and exact head/base revalidation.
