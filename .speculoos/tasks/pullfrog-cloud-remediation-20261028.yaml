scope:
  - reconstruct bounded claim, candidate, and terminal history only from artifacts produced by the exact trusted workflow path
  - mint a durable idempotent claim before provider invocation and cap remediation cycles and per-head attempts at three
  - invoke Pullfrog v0.1.102 through its native fix_review dispatch contract while withholding repository write authority
  - treat provider output as untrusted and rebuild it in a fresh read-only validation job against the exact source head, same-repository destination, forbidden-path policy, and gitlink prohibition
  - isolate a trusted publisher with one normal exact-head fast-forward push and verify the resulting PR head
  - require fresh Pullfrog, CI, repository-bound zero-secret Speculoos contract, and destination-guard evidence after every head mutation
  - preserve human-only approval and `main`/`master` merge authority while allowing a repository-owned exact-head automatic merge gate for eligible same-repository feature PRs targeting any other valid base
  - recognize only the two exact apostrophe variants of the recorded OpenAI cybersecurity-policy refusal and authorize at most one unchanged-head Pullfrog Astra review fallback
  - publish a composite exact-head review gate without giving the provider job content-write, check-write, publication, approval, dispatch, or merge authority
non_goals:
  - publishing this commit, activating the workflow on a serving ref, or running a hosted write pilot
  - force-push, force-with-lease, approval, Pullfrog-native auto-merge, merges to main or master, release, deployment, settings changes, branch deletion, billing changes, or credential creation
  - giving Pullfrog or another provider a repository write token
  - replacing Pullfrog with another reviewer, fixer, service, or fork
  - enabling the review fallback variable, running the Astra pilot, changing required checks, or treating Astra as independent cross-provider evidence
acceptance:
  - native fix_review payload binds issue_number, review_id, approved_only=false, exact branch, and v0.1.102 compatibility
  - provider, validator, and publisher credentials never coexist; Pullfrog is forced to reuse the job-scoped read token through GH_TOKEN instead of minting its normal MCP write token, authorPermission=none withholds gh and cross-run learning writes, and the separately provisioned publisher token is referenced only by the publish checkout
  - the durable claim artifact contains only claim.json, the sealed dispatch is transient and separate, claim upload precedes provider execution, and terminal receipt follows publication or a proven retryable failure
  - forked, stale, reused, protected, detached, forbidden-path, malformed-history, repeated-finding, unchanged-output, no-progress, and exhausted states fail closed
  - provider output remains untrusted until a fresh validator checkout emits a canonical candidate; claim, candidate, publish plan, patch, changed paths, source/result heads, and pushed terminal evidence are mutually digest-bound
  - provider remediation cannot modify the repository-owned coordinator, cycle, destination, remediation, auto-merge, Speculoos contract, shell validator, or executable workflow-policy test authority; candidate sealing and publication both re-run this path policy
  - the hosted publication inventory includes deleted paths and requires documentation impact to declare deleted documentation
  - exact head is re-read before provider execution, before patch application, and immediately before publication
  - publication is one normal fast-forward push to the current same-repository PR branch
  - automatic merge is performed only by a separate GitHub Actions job after a fresh clean coordinator receipt, same-repository and feature-head validation, exact live base/head re-read, successful Pullfrog/approval/CI/Speculoos/destination evidence, and no unresolved human changes-requested review
  - automatic merge accepts any valid base except `main` and `master`, the provider-free dogfood evidence trigger covers every such non-stable base including nested branch names, fresh app-bound exact-head evidence is refreshed immediately before mutation, and a two-parent merge commit is sent through one normal fast-forward Git receive-pack update to the literal reviewed base ref
  - the coordinator's exact default branch and effective protected-ref set, including the live base, are validated and digest-bound into the remediation claim and reused by candidate validation and publication so any admitted non-dev base remains consistent through the full pipeline
  - the receive-pack command carries the exact reviewed base SHA as its old OID, so the server rejects concurrent base advancement in the same ref-update transaction; concurrent PR retargeting cannot redirect the mutation, force and force-with-lease remain prohibited, and the source branch is never deleted
  - receive-pack discovery validates object IDs and capabilities separately from byte-preserved ref names, so an unrelated legal Unicode branch or tag cannot block the selected exact destination
  - because mutations made with the built-in token suppress ordinary push-triggered Actions runs, a merge into `dev` replays only the existing path-matched cross-repository updater and reusable-ref synchronization workflows through bounded workflow_dispatch calls and records any post-merge dispatch failure durably; other eligible bases do not dispatch `dev` publication automation
  - the publisher uses a separately approved event-emitting credential so successful publication schedules fresh Pullfrog, CI, and Speculoos evidence rather than relying on suppressed built-in-token events
  - artifact enumeration is complete, expired matching history fails closed, and PRs older than the 90-day durable-history window are not eligible for unattended remediation
  - canonical and materialized workflows are byte-identical, immutable-pinned, bounded, and actionlint-clean
  - the primary review is explicitly pinned to openai/gpt-sol at xhigh, and only one openai/gpt-astra at xhigh fallback may run for an unchanged exact PR/head/base identity
  - fallback eligibility requires exactly one failed Run review-only agent step, no other failed step, and exactly one failure annotation whose text literally equals one approved refusal variant
  - fallback results are size-bounded and schema-exact; review identity, model footer, finding count, comment actor, and comment head are freshly validated before the composite gate can succeed
  - ordinary failures, partial or malformed reviews, extra annotations or failed steps, whitespace-altered refusals, duplicate attempts, recursion, forks, identity drift, and Astra refusal all fail closed
  - the hosted Speculoos check uses only repository-reviewed source, fetches no private cross-repository package, receives no extra credential, runs candidate-facing Python entrypoints in isolated mode so repository files cannot shadow standard-library imports, and persists exact-head contract evidence even when validation fails
  - focused tests, workflow validation, full repository tests, whitespace checks, public-safety scans, and local official Speculoos validation pass
publication_boundary:
  statement: "Local source implementation and validation only. Publication, hosted activation, and the first write-capable remediation pilot require separate authorization for the exact commit SHA and scope. The repository-owned exact-head non-stable auto-merge gate is authorized for any valid base except main or master; approval, main/master merge, release, deployment, settings changes, force-push, branch deletion, billing, and credential changes remain prohibited."
delivery_policy:
  mode: inherit_branch_policy
documentation_impact:
  status: updated
  rationale: The native fix_review contract, credential split, artifact ledger, compare-and-swap publisher, exact-refusal review fallback, composite review gate, and activation boundaries must remain recoverable from repository source.
