id: pullfrog-cloud-remediation-20261028
title: Implement the guarded Pullfrog remediation and exact-head re-review loop
status: implementation
branch: feat/pullfrog-write-capable-loop
base_branch: dev
write_paths:
  - .github/workflows/pr-automation-dogfood-pr-trigger.yml
  - .github/workflows/pullfrog-cloud-remediation-loop.yml
  - .speculoos/actors.json
  - .speculoos/goal.md
  - .speculoos/manifest.yaml
  - .speculoos/review-evidence.json
  - .speculoos/tasks/pullfrog-cloud-remediation-20261028.yaml
  - docs/github-actions-template-catalog.md
  - docs/pullfrog-cloud-coordinator.md
  - docs/pullfrog-review-only-pilot.md
  - docs/workflow-asset-library-layout.md
  - scripts/github/pullfrog_cloud_remediation.py
  - scripts/github/tests/test_pullfrog_cloud_remediation.py
  - scripts/github/tests/test_pullfrog_cloud_remediation_workflow_policy.py
  - scripts/github/validate_pullfrog_workflow.sh
  - specs/pullfrog-cloud-remediation-20261028/commit-message.txt
  - specs/pullfrog-cloud-remediation-20261028/pr-body.md
  - templates/repo-workflow-materialization-manifest.json
  - templates/starter-workflows/pr-automation-dogfood-pr-trigger.yml
  - templates/starter-workflows/pullfrog-cloud-remediation-loop.yml
scope:
  - reconstruct bounded claim, candidate, and terminal history only from artifacts produced by the exact trusted workflow path
  - mint a durable idempotent claim before provider invocation and cap remediation cycles and per-head attempts at three
  - invoke Pullfrog v0.1.102 through its native fix_review dispatch contract while withholding repository write authority
  - treat provider output as untrusted and rebuild it in a fresh read-only validation job against the exact source head, same-repository destination, forbidden-path policy, and gitlink prohibition
  - isolate a trusted publisher with one normal exact-head fast-forward push and verify the resulting PR head
  - require fresh Pullfrog, CI, Speculoos, and destination-guard evidence after every head mutation
  - preserve human-only approval and merge authority
non_goals:
  - publishing this commit, activating the workflow on a serving ref, or running a hosted write pilot
  - force-push, force-with-lease, approval, auto-merge, merge, release, deployment, settings changes, branch deletion, billing changes, or credential creation
  - giving Pullfrog or another provider a repository write token
  - replacing Pullfrog with another reviewer, fixer, service, or fork
acceptance:
  - native fix_review payload binds issue_number, review_id, approved_only=false, exact branch, and v0.1.102 compatibility
  - provider, validator, and publisher credentials never coexist; Pullfrog is forced to reuse the job-scoped read token through GH_TOKEN instead of minting its normal MCP write token, authorPermission=none withholds gh and cross-run learning writes, and no secret or elevated token is mapped
  - the durable claim artifact contains only claim.json, the sealed dispatch is transient and separate, claim upload precedes provider execution, and terminal receipt follows publication or a proven retryable failure
  - forked, stale, reused, protected, detached, forbidden-path, malformed-history, repeated-finding, unchanged-output, no-progress, and exhausted states fail closed
  - provider output remains untrusted until a fresh validator checkout emits a canonical candidate; claim, candidate, publish plan, patch, changed paths, source/result heads, and pushed terminal evidence are mutually digest-bound
  - exact head is re-read before provider execution, before patch application, and immediately before publication
  - publication is one normal fast-forward push to the current same-repository PR branch
  - canonical and materialized workflows are byte-identical, immutable-pinned, bounded, and actionlint-clean
  - focused tests, workflow validation, full repository tests, whitespace checks, public-safety scans, and Speculoos validation pass
publication_boundary:
  statement: "Local source implementation and validation only. Publication, hosted activation, and the first write-capable pilot require separate authorization for the exact commit SHA and scope. Approval, merge, release, deployment, settings changes, force-push, branch deletion, billing, and credential changes remain prohibited."
documentation_impact:
  status: updated
  rationale: The native fix_review contract, credential split, artifact ledger, compare-and-swap publisher, and activation boundary must remain recoverable from repository source.
validation:
  - "python3 -m unittest scripts/github/tests/test_pullfrog_cloud_remediation.py -v"
  - "python3 -m unittest scripts/github/tests/test_pullfrog_cloud_remediation_workflow_policy.py -v"
  - "python3 -m py_compile scripts/github/pullfrog_cloud_remediation.py scripts/github/pullfrog_cloud_coordinator.py scripts/github/pullfrog_cycle_contract.py scripts/github/pullfrog_destination_guard.py"
  - "scripts/github/validate_pullfrog_workflow.sh"
  - "python3 -m unittest discover -s scripts/github/tests -p 'test_*.py' -q"
  - "python3 scripts/github/materialize_repo_workflow_templates.py --repo-root . --manifest-path templates/repo-workflow-materialization-manifest.json"
  - "git diff --check"
  - "speculoos validate --repo . --repo-slug fr-meyer/agent-toolkit --base dev --task pullfrog-cloud-remediation-20261028 --validation 'scripts/github/validate_pullfrog_workflow.sh' --json"
  - "speculoos publish-check --base origin/dev --task pullfrog-cloud-remediation-20261028 --pr-body specs/pullfrog-cloud-remediation-20261028/pr-body.md --commit-message specs/pullfrog-cloud-remediation-20261028/commit-message.txt --json"
private_data_scan: required
publish_authority: Local commit preparation only; hosted publication, activation, and every write-capable run remain separately gated.
notes:
  - Pullfrog is the sole AI reviewer and fixer. Speculoos remains independent exact-head evidence.
  - The provider job has no GitHub write token and cannot mint Pullfrog's normal MCP write token; a separate read-only validator seals its raw output; the publisher has no provider identity token.
  - Pullfrog approval and auto-merge stay disabled, and every merge remains human-authorized.
  - The first hosted pilot must be bounded to one explicitly authorized same-repository feature head and must stop rather than bypass an unsupported native fix_review path.
