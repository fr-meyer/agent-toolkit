name: Repository similarity preflight CI

on:
  pull_request:
    paths:
      - "skills/repository-similarity-preflight/**"
      - ".github/workflows/repository-similarity-preflight-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-repository-similarity-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run unit tests
        run: python -m unittest discover -s skills/repository-similarity-preflight/tests -q

      - name: Compile the helper
        run: python -m py_compile skills/repository-similarity-preflight/scripts/repository_similarity_preflight.py

      - name: Validate the Agent Skill
        run: npx --yes skills-ref@0.1.5 validate skills/repository-similarity-preflight

      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Check checked-out commit whitespace
        if: github.event_name == 'workflow_dispatch'
        run: git diff --check HEAD^ HEAD
