# Managed by templates/repo-workflow-materialization-manifest.json.
# Edit this canonical template, then rematerialize the live workflow.
name: Speculoos Trusted Canary
run-name: "Speculoos trusted canary · PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.head.sha }}"

on:
  pull_request_target:
    branches:
      - '**'
      - '!main'
      - '!master'
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: >-
    speculoos-shadow-${{ github.repository_id }}-${{ github.event.pull_request.number }}-${{
      github.event.pull_request.head.sha
    }}
  cancel-in-progress: true

jobs:
  speculoos:
    name: speculoos-trusted-canary
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'test/speculoos-shadow-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted default-branch validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout exact pull-request head as data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify exact head and base availability
        shell: bash
        env:
          EXPECTED_TRUSTED_SHA: ${{ github.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/speculoos
          test "$(git -C trusted rev-parse HEAD)" = "$EXPECTED_TRUSTED_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git -C candidate fetch --quiet --no-tags origin \
            "+refs/heads/$EXPECTED_BASE_REF:refs/remotes/origin/$EXPECTED_BASE_REF"
          test "$(git -C candidate rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF^{commit}")" = "$EXPECTED_BASE_SHA"

      - name: Validate repository-bound Speculoos contract
        shell: bash
        env:
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python -I trusted/scripts/github/speculoos_per_pr_contract.py \
            --repo candidate \
            --trusted-repo trusted \
            --repo-slug "$GITHUB_REPOSITORY" \
            --expected-head-repo "$EXPECTED_HEAD_REPO" \
            --task-source per-pr \
            --expected-head-ref "$EXPECTED_HEAD_REF" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-base-ref "$EXPECTED_BASE_REF" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --output artifacts/speculoos/contract.json

      - name: Bind trusted workflow run to exact PR revision
        shell: bash
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -I trusted/scripts/github/pullfrog_speculoos_attestation.py \
            --report artifacts/speculoos/contract.json \
            --output artifacts/speculoos/attestation.json \
            --repository-id "$REPOSITORY_ID" \
            --pr-number "$PR_NUMBER" \
            --head-ref "$HEAD_REF" \
            --head-sha "$HEAD_SHA" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Persist independent Speculoos evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: speculoos-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/speculoos
          if-no-files-found: warn
          retention-days: 90
