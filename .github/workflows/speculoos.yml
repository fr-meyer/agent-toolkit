# Managed by templates/repo-workflow-materialization-manifest.json.
# Edit this canonical template, then rematerialize the live workflow.
name: Speculoos
run-name: Speculoos · PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches:
      - '**'
      - '!main'
      - '!master'
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: >-
    speculoos-${{ github.repository_id }}-${{ github.event.pull_request.number }}-${{
      github.event.pull_request.head.sha
    }}
  cancel-in-progress: true

jobs:
  speculoos:
    name: speculoos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify exact head and base availability
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/speculoos
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch --quiet --no-tags origin \
            "+refs/heads/$EXPECTED_BASE_REF:refs/remotes/origin/$EXPECTED_BASE_REF"
          test "$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF^{commit}")" = "$EXPECTED_BASE_SHA"

      - name: Validate repository-bound Speculoos contract
        shell: bash
        env:
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          task_id="$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path('.speculoos/manifest.yaml').read_text(encoding='utf-8')
          match = re.search(r'(?m)^current_task:\s*([^#\n]*?)\s*$', text)
          if not match:
              raise SystemExit('manifest current_task is missing')
          task_id = match.group(1).strip().strip("'\"")
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,127}', task_id):
              raise SystemExit('manifest current_task is invalid')
          print(task_id)
          PY
          )"
          python scripts/github/speculoos_pr_contract.py \
            --repo . \
            --repo-slug "$GITHUB_REPOSITORY" \
            --task "$task_id" \
            --expected-head-ref "$EXPECTED_HEAD_REF" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-base-ref "$EXPECTED_BASE_REF" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --output artifacts/speculoos/contract.json

      - name: Validate Pullfrog workflow surface
        shell: bash
        run: |
          set -euo pipefail
          scripts/github/validate_pullfrog_workflow.sh \
            | tee artifacts/speculoos/workflow-validation.txt

      - name: Persist independent Speculoos evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: speculoos-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/speculoos
          if-no-files-found: warn
          retention-days: 90
